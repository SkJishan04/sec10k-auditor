[project]
name = "sec10k-auditor"
version = "0.1.0"
description = "Agentic hybrid-RAG financial risk auditor for SEC 10-K filings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.1",
    "anthropic>=0.34.0",
    "pypdf>=4.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
training = [
    "torch>=2.3.0",
    "transformers>=4.42.0",
    "peft>=0.11.1",
    "trl>=0.9.4",
    "bitsandbytes>=0.43.1",
    "datasets>=2.20.0",
]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"